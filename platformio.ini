; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = mains_power

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#6a5e1fcf97c3a378b20c48853667b017f05fc942
; platform_packages =
;     framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.1.1
    ; framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.2/esp32-arduino-libs-3.0.2.zip
framework = arduino
board = seeed_xiao_esp32c6
board_build.partitions = partitions.csv
extra_scripts = merge-bin.py

[common]
build_flags =
	-D CORE_DEBUG_LEVEL=4
	-D ZIGBEE_MODE_ED
    ; -D ARDUINO_USB_CDC_ON_BOOT=0 ; Enable this to display logs on the uart output instead of the usb
    ; -D DEBUG_NO_SLEEP ; Enable this to disable the device from going to deep sleep

[env:mains_power]
build_flags = ${common.build_flags}

[env:battery_power]
build_flags = ${common.build_flags}
              -D BATTERY_POWERED