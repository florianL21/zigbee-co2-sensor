name: Build ESP images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  create:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        target:
          - env: battery_power
          - env: mains_power

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Build PlatformIO Project
        run: pio run -t mergebin -e ${{ matrix.target.env }}
      - run: |
            sudo mv .pio/build/${{ matrix.target.env }}/firmware-merged.bin .pio/build/co2_sensor_${{ matrix.target.env }}.bin
      - name: Store built binaries
        uses: actions/upload-artifact@v4
        with:
          name: co2_sensor_${{ matrix.target.env }}
          path: |
            .pio/build/co2_sensor_${{ matrix.target.env }}.bin
            .pio/build/${{ matrix.target.env }}/firmware.elf
            .pio/build/${{ matrix.target.env }}/firmware.map
  release:
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - run: mkdir -p release
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: co2_sensor_*
          merge-multiple: true
      - name: Create release tag
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          tagging_message: ${{ inputs.version }}
          skip_checkout: true
          skip_fetch: false
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ inputs.version }}
